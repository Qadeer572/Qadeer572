<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="50%" stop-color="#0B1A30"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>

    <linearGradient id="resNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A4A"/>
      <stop offset="100%" stop-color="#0A182E"/>
    </linearGradient>

    <filter id="resGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .rtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #F8FAFC; }
      .rdesc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #94A3B8; }
      .loop-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 600; fill: #F43F5E; }
      .valid-label { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 600; fill: #00F5D4; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="210" rx="12" fill="url(#resBg)" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- ================= NODES ================= -->

  <!-- Node 1: Topic Input -->
  <g transform="translate(25, 45)">
    <rect width="140" height="58" rx="8" fill="url(#resNode)" stroke="#00B4D8" stroke-width="1.2"/>
    <text x="12" y="24" class="rtitle">🎯 Topic Input</text>
    <text x="12" y="42" class="rdesc">User Search Objective</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 165 74 L 195 74" stroke="#00F5D4" stroke-width="2" fill="none"/>
  <polygon points="195,74 187,70 187,78" fill="#00F5D4"/>

  <!-- Node 2: Refinement & Validation -->
  <g transform="translate(200, 45)">
    <rect width="165" height="58" rx="8" fill="url(#resNode)" stroke="#00F5D4" stroke-width="1.4"/>
    <text x="12" y="24" class="rtitle">🔍 Refine &amp; Validate</text>
    <text x="12" y="42" class="rdesc">LLM Scope Assessment</text>
  </g>

  <!-- Cyclic Re-prompt Loop from Node 2 -->
  <path d="M 282 103 L 282 135 L 140 135 L 140 103" stroke="#F43F5E" stroke-width="1.4" fill="none" stroke-dasharray="3,3"/>
  <polygon points="140,103 136,111 144,111" fill="#F43F5E"/>
  <rect x="175" y="125" width="80" height="18" rx="4" fill="#1C0F1A" stroke="#F43F5E" stroke-width="0.8"/>
  <text x="182" y="137" class="loop-label">↻ Re-prompt</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 365 74 L 400 74" stroke="#00F5D4" stroke-width="2" fill="none"/>
  <polygon points="400,74 392,70 392,78" fill="#00F5D4"/>
  <text x="368" y="65" class="valid-label">Valid</text>

  <!-- Node 3: Parallel Multi-Sourcing -->
  <g transform="translate(405, 40)">
    <rect width="170" height="68" rx="8" fill="#122E52" stroke="#00F5D4" stroke-width="1.8" filter="url(#resGlow)"/>
    <text x="12" y="24" class="rtitle" fill="#FFFFFF">🌐 Parallel Sourcing</text>
    <text x="12" y="42" class="rdesc" fill="#38BDF8">Tavily • ArXiv • NewsAPI</text>
    <text x="12" y="56" class="rdesc" fill="#94A3B8">Parallel Tool Calling</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 575 74 L 610 74" stroke="#00F5D4" stroke-width="2" fill="none"/>
  <polygon points="610,74 602,70 602,78" fill="#00F5D4"/>

  <!-- Node 4: Synthesis -->
  <g transform="translate(615, 45)">
    <rect width="125" height="58" rx="8" fill="url(#resNode)" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="12" y="24" class="rtitle">🧠 Synthesis</text>
    <text x="12" y="42" class="rdesc">LLM Aggregator</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 740 74 L 765 74" stroke="#00F5D4" stroke-width="2" fill="none"/>
  <polygon points="765,74 757,70 757,78" fill="#00F5D4"/>

  <!-- Node 5: Document Output -->
  <g transform="translate(770, 45)">
    <rect width="90" height="58" rx="8" fill="#0E2849" stroke="#00F5D4" stroke-width="1.4"/>
    <text x="10" y="24" class="rtitle">📑 Reports</text>
    <text x="10" y="42" class="rdesc">PDF + DOCX</text>
  </g>

  <!-- Bottom HITL Status Bar -->
  <g transform="translate(180, 168)">
    <rect width="520" height="26" rx="13" fill="#091A30" stroke="#00B4D8" stroke-width="0.8"/>
    <text x="260" y="17" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">
      ⚡ Real-Time SSE Progress Streaming &amp; Human-in-the-Loop (HITL) Checkpoints
    </text>
  </g>
</svg>
