<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%">
  <defs>
    <linearGradient id="metBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050D1A"/>
      <stop offset="50%" stop-color="#0B1A30"/>
      <stop offset="100%" stop-color="#071324"/>
    </linearGradient>

    <linearGradient id="metCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122B4D"/>
      <stop offset="100%" stop-color="#09182E"/>
    </linearGradient>

    <linearGradient id="cyanNum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="metGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 28px; }
      .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #F8FAFC; letter-spacing: 0.5px; }
      .stat-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #94A3B8; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="140" rx="12" fill="url(#metBg)" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Stat 1: Total Contributions -->
  <g transform="translate(20, 20)">
    <rect width="195" height="100" rx="10" fill="url(#metCard)" stroke="#00F5D4" stroke-width="1.2"/>
    <rect width="195" height="3" rx="1.5" fill="#00F5D4"/>
    <text x="16" y="42" fill="url(#cyanNum)" class="stat-num" filter="url(#metGlow)">2,000+</text>
    <text x="16" y="68" class="stat-lbl">TOTAL CONTRIBUTIONS</text>
    <text x="16" y="86" class="stat-sub">Across Public &amp; Private Repos</text>
  </g>

  <!-- Stat 2: Total Repositories -->
  <g transform="translate(235, 20)">
    <rect width="195" height="100" rx="10" fill="url(#metCard)" stroke="#00B4D8" stroke-width="1.2"/>
    <rect width="195" height="3" rx="1.5" fill="#00B4D8"/>
    <text x="16" y="42" fill="url(#cyanNum)" class="stat-num" filter="url(#metGlow)">46+</text>
    <text x="16" y="68" class="stat-lbl">CODE REPOSITORIES</text>
    <text x="16" y="86" class="stat-sub">AI Pipelines, Apps &amp; Tools</text>
  </g>

  <!-- Stat 3: Multi-Agent Systems -->
  <g transform="translate(450, 20)">
    <rect width="195" height="100" rx="10" fill="url(#metCard)" stroke="#38BDF8" stroke-width="1.2"/>
    <rect width="195" height="3" rx="1.5" fill="#38BDF8"/>
    <text x="16" y="42" fill="url(#cyanNum)" class="stat-num" filter="url(#metGlow)">4+</text>
    <text x="16" y="68" class="stat-lbl">PRODUCTION AI AGENTS</text>
    <text x="16" y="86" class="stat-sub">LangGraph • Debate • RAG</text>
  </g>

  <!-- Stat 4: Python & Async Dominance -->
  <g transform="translate(665, 20)">
    <rect width="195" height="100" rx="10" fill="url(#metCard)" stroke="#818CF8" stroke-width="1.2"/>
    <rect width="195" height="3" rx="1.5" fill="#818CF8"/>
    <text x="16" y="42" fill="url(#cyanNum)" class="stat-num" filter="url(#metGlow)">92%+</text>
    <text x="16" y="68" class="stat-lbl">PYTHON &amp; AI STACK</text>
    <text x="16" y="86" class="stat-sub">Async FastAPI &amp; Graph Core</text>
  </g>
</svg>
