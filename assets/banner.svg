<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="35%" stop-color="#0A192F"/>
      <stop offset="70%" stop-color="#0F284D"/>
      <stop offset="100%" stop-color="#071426"/>
    </linearGradient>

    <!-- Glowing Cyan / Electric Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#48CAE4"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132A4A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A182E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0077B6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .dot-pulse {
        animation: pulseDot 2s infinite ease-in-out;
        transform-origin: 321px 41px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        font-weight: 800;
        letter-spacing: 2.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        font-weight: 700;
        letter-spacing: 2.5px;
      }
      .card-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        font-weight: 700;
        font-size: 12px;
      }
      .badge-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="898" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Decorative Tech Grid & Neural Lines -->
  <g opacity="0.18">
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="150" y1="0" x2="150" y2="320" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="450" y1="0" x2="450" y2="320" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="750" y1="0" x2="750" y2="320" stroke="#00B4D8" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Glowing Neural Accent Lines (Left Side) -->
  <path d="M 50 160 L 140 100 L 220 130 L 300 70" fill="none" stroke="#00F5D4" stroke-width="1.5" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="140" cy="100" r="3" fill="#00F5D4" opacity="0.7"/>
  <circle cx="220" cy="130" r="3" fill="#00F5D4" opacity="0.7"/>
  <circle cx="300" cy="70" r="3.5" fill="#00F5D4" opacity="0.8"/>

  <!-- Glowing Neural Accent Lines (Right Side) -->
  <path d="M 850 160 L 760 100 L 680 130 L 600 70" fill="none" stroke="#00B4D8" stroke-width="1.5" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="760" cy="100" r="3" fill="#00B4D8" opacity="0.7"/>
  <circle cx="680" cy="130" r="3" fill="#00B4D8" opacity="0.7"/>
  <circle cx="600" cy="70" r="3.5" fill="#00B4D8" opacity="0.8"/>

  <!-- Top Status Pill -->
  <g transform="translate(305, 28)">
    <rect width="290" height="26" rx="13" fill="#0E2442" stroke="#00B4D8" stroke-width="1" opacity="0.9"/>
    <circle cx="16" cy="13" r="4.5" fill="#00F5D4" class="dot-pulse" filter="url(#glow)"/>
    <circle cx="16" cy="13" r="2.5" fill="#FFFFFF"/>
    <text x="32" y="17" fill="#E2E8F0" class="badge-text">AGENTIC AI &amp; MULTI-AGENT SYSTEMS</text>
  </g>

  <!-- Main Hero Title -->
  <text x="450" y="112" text-anchor="middle" fill="#FFFFFF" font-size="38" class="title-text">
    QADEER RAZA
  </text>

  <!-- Gradient Subtitle -->
  <text x="450" y="146" text-anchor="middle" fill="url(#cyanBlueGrad)" font-size="14" class="sub-text" filter="url(#softGlow)">
    AGENTIC AI &amp; GENERATIVE AI SYSTEMS ENGINEER
  </text>

  <!-- Subtle Separator -->
  <line x1="280" y1="168" x2="620" y2="168" stroke="url(#glowLine)" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="450" y="193" text-anchor="middle" fill="#94A3B8" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-style="italic">
    "Architecting deterministic multi-agent graphs, autonomous tool calling &amp; scalable LLM pipelines"
  </text>

  <!-- 4 Core Feature / Hook Cards -->
  <!-- Card 1 -->
  <g transform="translate(45, 222)">
    <rect width="185" height="64" rx="10" fill="url(#cardGrad)" stroke="#1F4E79" stroke-width="1.2"/>
    <rect width="185" height="3" rx="1.5" fill="#00F5D4" opacity="0.9"/>
    <text x="14" y="27" fill="#00F5D4" font-size="14">🤖</text>
    <text x="36" y="26" fill="#F8FAFC" class="card-text">Multi-Agent Graphs</text>
    <text x="14" y="48" fill="#94A3B8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">LangGraph &amp; Debate Loops</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(250, 222)">
    <rect width="185" height="64" rx="10" fill="url(#cardGrad)" stroke="#1F4E79" stroke-width="1.2"/>
    <rect width="185" height="3" rx="1.5" fill="#00B4D8" opacity="0.9"/>
    <text x="14" y="27" fill="#00B4D8" font-size="14">⚡</text>
    <text x="36" y="26" fill="#F8FAFC" class="card-text">Production RAG</text>
    <text x="14" y="48" fill="#94A3B8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Hybrid Search &amp; Vector DBs</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(455, 222)">
    <rect width="185" height="64" rx="10" fill="url(#cardGrad)" stroke="#1F4E79" stroke-width="1.2"/>
    <rect width="185" height="3" rx="1.5" fill="#48CAE4" opacity="0.9"/>
    <text x="14" y="27" fill="#48CAE4" font-size="14">🚀</text>
    <text x="36" y="26" fill="#F8FAFC" class="card-text">Streaming Backends</text>
    <text x="14" y="48" fill="#94A3B8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">FastAPI • Real-Time SSE</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(660, 222)">
    <rect width="195" height="64" rx="10" fill="url(#cardGrad)" stroke="#1F4E79" stroke-width="1.2"/>
    <rect width="195" height="3" rx="1.5" fill="#00F5D4" opacity="0.9"/>
    <text x="14" y="27" fill="#00F5D4" font-size="14">🛡️</text>
    <text x="36" y="26" fill="#F8FAFC" class="card-text">Guardrails &amp; HITL</text>
    <text x="14" y="48" fill="#94A3B8" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Strict Evals &amp; Fallbacks</text>
  </g>
</svg>
